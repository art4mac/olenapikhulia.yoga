<!-- adaptive rem: scale-up above the 1920 design width, applied before first paint -->
<script>
(function () {
  var FONT_BASE = 16, BASE_W = 1920, COEF = 0.6666;
  function setRootFontSize() {
    var reduction = ((BASE_W - window.innerWidth) / BASE_W) * 100 * COEF;
    var size = FONT_BASE - (FONT_BASE * reduction) / 100;
    if (size > FONT_BASE) document.documentElement.style.fontSize = size + "px";
    else document.documentElement.style.removeProperty("font-size");
  }
  setRootFontSize();
  window.addEventListener("resize", setRootFontSize);
  window.__setRootFontSize = setRootFontSize;
})();
</script>

<style>
/* ============================================================
   Tokens — "warm linen" palette, derived from the photo set
   ============================================================ */
:root{
  --background:#f6f1e8;      /* linen page */
  --foreground:#2a2521;
  --surface:#ede4d6;         /* cards */
  --surface-card:#fbf8f2;
  --ink:#2a2521;             /* text + dark bands */
  --ink-deep:#140f0c;        /* display type over photography */
  --ink-soft:#6b6259;        /* muted body */
  --brand:#b4653f;           /* terracotta accent */
  --brand-light:#c98a63;     /* hover / focus ring */
  --accent-sage:#8c9a80;     /* second accent */
  --ghost:#e2d8c8;           /* oversized ghost text */
  --uy-grey:#b2b2b2;         /* the Ukrainian Yogis logo's own grey */
  --hairline:#dfd5c6;
  --on-ink:#f6f1e8;          /* text on the dark bands */

  --radius-card:1.5rem;
  --radius-card-lg:2rem;
  --radius-pill:62.5rem;
  --radius-xl:0.75rem;

  --page-inset:0.5rem;

  /* Two voices: a high-contrast display serif for the headlines and the
     wordmark, a quiet geometric sans for everything that has to be read or
     tapped. Both carry the full Ukrainian set (Ґ Є І Ї). */
  --font-display:"Playfair Display",Georgia,"Times New Roman",serif;
  --font-text:"Manrope","Montserrat",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}

/* ============================================================
   Reset
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
*{margin:0}
html{font-size:16px;-webkit-text-size-adjust:100%}
img,svg,video{display:block;max-width:100%}
body{
  min-height:100vh;
  background:var(--background);
  color:var(--foreground);
  font-family:var(--font-text);
  font-weight:400;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
ul,ol{list-style:none;padding:0}
h1,h2,h3,p,figure,blockquote,dl,dd{margin:0}
address{font-style:normal}
:focus-visible{outline:2px solid var(--brand-light);outline-offset:2px}

.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
}
html.is-locked{position:relative;overflow:hidden;height:100%}

/* ============================================================
   Display voice
   Everything set large — the banner line, the section heads, the ghost rows,
   the wordmark, the essay opener — runs in the serif. Anything read at body
   size, tapped, or set as a small tracked label stays in the sans, where a
   Didone would only cost legibility.
   ============================================================ */
#hero-title,.hero-tagline,#about-title,.about-card h3,
#formats-title,.format-name,#forwhom-title,#facts-title,.fact-line,
.socials-title,#letter-title,.letter-body .letter-lead,#dance-title,
.footer-cta p,.menu-nav a,.hdr-brand,.footer-brand-row,.menu-brand,.loader-mark{
  font-family:var(--font-display);
}

/* ============================================================
   Adaptive rem grid
   ============================================================ */
@media (max-width:1920px){ html{font-size:0.833333vw} }
@media (max-width:1440px){ html{font-size:1.111111vw} }
@media (max-width:1024px){ html{font-size:1.5625vw} }
@media (max-width:640px){  html{font-size:4.444444vw} }

@media (min-width:640px){ :root{ --page-inset:0.75rem } }

main{width:100%;overflow-x:clip;padding:var(--page-inset)}

/* ============================================================
   Reveal primitives
   ============================================================ */
.line{display:block;overflow:hidden;padding-bottom:0.14em}
.line > span{display:block;transform:translateY(115%);opacity:0;will-change:transform,opacity}
.line.is-in > span{transform:translateY(0);opacity:1}

.clip{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:0.12em}
/* Й and Ґ carry marks above the cap line, and the reveal mask cuts at the box
   edge — the display lines that hold them get that room back without moving
   anything on the page */
#hero-title .clip,
#letter-title .line{padding-top:0.3em;margin-top:-0.3em}
.clip > span{display:inline-block;transform:translateY(115%);opacity:0;will-change:transform,opacity}
.clip.is-in > span{transform:translateY(0);opacity:1}

.wf{display:inline-block}
.wf > span{display:inline-block;transform:translateY(18px);opacity:0;will-change:transform,opacity}
.wf.is-in > span{transform:translateY(0);opacity:1}

.js-rev{opacity:0}

/* ============================================================
   Shared components
   ============================================================ */
.eyebrow{
  display:inline-flex;align-items:center;gap:0.5rem;
  font-size:0.875rem;font-weight:500;text-transform:uppercase;letter-spacing:0.22em;
}
.eyebrow::before{
  content:"";width:0.375rem;height:0.375rem;border-radius:var(--radius-pill);
  background:var(--brand);flex:none;
}
.eyebrow--dark{color:var(--ink-soft)}
.eyebrow--light{color:rgba(246,241,232,0.7)}
.eyebrow--light::before{background:var(--brand-light)}

.pill{
  display:inline-flex;align-items:center;gap:0.5rem;
  border-radius:var(--radius-pill);
  padding:0.875rem 1.75rem;
  font-size:1.125rem;font-weight:500;text-transform:uppercase;letter-spacing:0.05em;
  transition:background-color 220ms ease,color 220ms ease,border-color 220ms ease;
  border:1px solid transparent;
}
.pill svg{width:1rem;height:1rem;flex:none}
.pill--solid{background:var(--ink);color:var(--on-ink)}
.pill--solid:hover{background:var(--brand)}
.pill--light{background:var(--on-ink);color:var(--ink)}
.pill--light:hover{background:var(--brand);color:var(--on-ink)}
.pill--outline{border-color:currentColor;color:var(--ink);background:transparent}
.pill--outline:hover{background:var(--ink);color:var(--on-ink)}

.abtn{
  width:3rem;height:3rem;display:grid;place-items:center;
  border-radius:var(--radius-pill);border:1px solid transparent;
  transition:background-color 220ms ease,color 220ms ease,border-color 220ms ease;
}
@media (min-width:640px){ .abtn{width:3.5rem;height:3.5rem} }
.abtn svg{width:1.25rem;height:1.25rem}
.abtn--outline{border-color:var(--hairline);background:transparent;color:var(--ink)}
.abtn--outline:hover{border-color:var(--ink)}
.abtn--solid{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.abtn--solid:hover{background:var(--brand);border-color:var(--brand)}

.dots{display:flex;align-items:center;gap:0.5rem}
.dots button{padding:0.375rem;display:block;line-height:0}
.dots i{
  display:block;height:0.375rem;width:0.375rem;border-radius:var(--radius-pill);
  transition:width 320ms cubic-bezier(0.16,1,0.3,1),background-color 320ms ease;
}
.dots--dark i{background:var(--ghost)}
.dots--dark [aria-current="true"] i{background:var(--ink);width:1.25rem}
.dots--light i{background:rgba(42,37,33,0.25)}
.dots--light [aria-current="true"] i{background:var(--ink);width:1.25rem}

/* language toggle */
.lang{display:inline-flex;align-items:center;gap:0.25rem;font-size:0.875rem;font-weight:500;letter-spacing:0.12em}
.lang button{
  padding:0.25rem 0.5rem;border-radius:var(--radius-pill);
  text-transform:uppercase;transition:background-color 200ms ease,color 200ms ease,opacity 200ms ease;
  opacity:0.55;
}
.lang button[aria-pressed="true"]{opacity:1;background:rgba(42,37,33,0.1)}
.lang--on-ink button[aria-pressed="true"]{background:rgba(246,241,232,0.18)}
.lang span{opacity:0.35}

/* ============================================================
   Header (above the hero, on the linen page)
   The bar rides along on scroll and only puts on a plate once the page
   has moved, so at rest it reads as part of the page, not as chrome.
   ============================================================ */
.site-header{
  position:sticky;top:0;z-index:50;
  padding:0.5rem 0 0.75rem;
  font-size:0.875rem;color:var(--ink);
}
.hdr-bar{
  position:relative;isolation:isolate;
  /* three zones: the УФЙ credential, the wordmark dead centre, the controls.
     The side columns share one 1fr each, so the middle stays optically centred. */
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:1rem;
  /* the inline padding lines the wordmark up with the banner's own text inset */
  padding:0.625rem 1.5rem;
  border-radius:var(--radius-pill);
  transition:background-color 320ms ease,box-shadow 320ms ease;
}
@media (min-width:640px){ .hdr-bar{padding:0.75rem 2.5rem} }
.hdr-bar > *{position:relative;z-index:2}

/* Liquid glass, built in three layers the way a real lens reads:
   ::before refracts and blurs what is behind, ::after paints the specular
   rim and the sheen sliding across the top, and the bar itself carries the
   faint tint and the shadow it casts on the page. */
.hdr-bar::before,
.hdr-bar::after{
  content:"";position:absolute;inset:0;border-radius:inherit;
  pointer-events:none;opacity:0;
  transition:opacity 340ms ease;
}
/* Safari and Firefox stop at filter functions, so they get plain frosting */
.hdr-bar::before{
  z-index:0;
  -webkit-backdrop-filter:blur(18px) saturate(180%) brightness(1.06);
  backdrop-filter:blur(18px) saturate(180%) brightness(1.06);
}
/* where SVG filters are allowed through the backdrop, the blur gives way to a
   displacement map: the photo bends across the pill instead of just softening */
@supports (backdrop-filter:url("#hdr-glass")) or (-webkit-backdrop-filter:url("#hdr-glass")){
  .hdr-bar::before{
    -webkit-backdrop-filter:url("#hdr-glass") blur(4px) saturate(180%) brightness(1.14);
    backdrop-filter:url("#hdr-glass") blur(4px) saturate(180%) brightness(1.14);
  }
}
.hdr-bar::after{
  z-index:1;
  background:linear-gradient(
    160deg,
    rgba(255,255,255,0.5) 0%,
    rgba(255,255,255,0.12) 24%,
    rgba(255,255,255,0) 46%,
    rgba(255,255,255,0.08) 78%,
    rgba(255,255,255,0.28) 100%);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,0.45),
    inset 0 1.5px 1px rgba(255,255,255,0.95),
    inset 0 -1.5px 1px rgba(255,255,255,0.55),
    inset 0 0 1.5rem rgba(255,255,255,0.3);
}
/* the tint has to stay heavy enough that the ink wordmark keeps its contrast
   when the pill crosses one of the dark bands */
.site-header.is-stuck .hdr-bar{
  background:rgba(252,249,244,0.52);
  box-shadow:
    0 0.5rem 1.75rem rgba(42,37,33,0.14),
    0 0.0625rem 0.25rem rgba(42,37,33,0.06);
}
.site-header.is-stuck .hdr-bar::before,
.site-header.is-stuck .hdr-bar::after{opacity:1}

.hdr-brand{
  justify-self:center;
  display:flex;align-items:center;gap:0.5rem;white-space:nowrap;
  font-size:1.375rem;font-weight:500;text-transform:uppercase;letter-spacing:0;
}
@media (min-width:640px){ .hdr-brand{font-size:1.625rem} }

/* The Ukrainian Yogis lockup — pictogram over the calligraphic wordmark. Shipped
   as an alpha-only PNG and painted through a mask, so it keeps the brand grey on
   the linen and on the dark bands alike and needs no second colour variant. */
.uy-mark{
  flex:none;aspect-ratio:339/470;
  background-color:var(--uy-grey);
  -webkit-mask:url(assets/uy-logo.png) center/contain no-repeat;
          mask:url(assets/uy-logo.png) center/contain no-repeat;
}
.hdr-ufy{justify-self:start;display:flex;align-items:center;gap:0.625rem;min-width:0}
.hdr-uy{height:3.5rem}
/* the credential is spelled out in full in both languages, so it runs three
   lines inside the bar — still shorter than the burger, which sets the height */
.hdr-role{
  font-size:0.625rem;font-weight:500;line-height:1.25;
  text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-soft);
  max-width:9.5rem;
}

/* on phones the bar carries the mark, the wordmark and the burger — nothing
   else fits that row */
@media (max-width:640px){
  .hdr-bar{gap:0.5rem}
  /* sized off the English wordmark, which is the longer of the two */
  .hdr-brand{min-width:0;overflow:hidden;text-overflow:ellipsis}
  /* no room for the credential line next to the mark — the mark carries it */
  .hdr-role{display:none}
  .hdr-uy{height:2.25rem}
  /* the language switch lives in the burger menu on phones, where it has room
     to be a proper tap target */
  .site-header .lang{display:none}
}

.hdr-right{justify-self:end;flex:none;display:flex;align-items:center;gap:1rem}
@media (min-width:640px){ .hdr-right{gap:1.25rem} }

.burger{
  width:2.5rem;height:2.5rem;display:grid;place-items:center;gap:5px;
  border-radius:var(--radius-pill);
  background:rgba(42,37,33,0.1);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  transition:background-color 220ms ease;
  grid-auto-rows:1px;align-content:center;
}
.burger:hover{background:rgba(42,37,33,0.2)}
.burger i{display:block;width:1rem;height:1px;background:var(--ink)}

/* ============================================================
   Hero
   ============================================================ */
/* the banner gives up the height the header now takes above it */
.hero{
  position:relative;isolation:isolate;overflow:hidden;
  border-radius:var(--radius-card-lg);
  background:var(--surface);color:var(--ink);
  height:calc(100svh - 1rem - var(--hdr-h,0px));
  min-height:32rem;
  display:flex;flex-direction:column;
}
@media (min-width:640px){ .hero{height:calc(100svh - 1.5rem - var(--hdr-h,0px))} }

.hero-plate{position:absolute;inset:0;z-index:-10}
.hero-plate-inner{position:absolute;left:0;right:0;top:-16%;height:132%;width:100%;will-change:transform}
.hero-plate-inner picture{display:block;width:100%;height:100%}
.hero-plate-inner img{width:100%;height:100%;object-fit:cover;object-position:50% 84%}
@media (max-width:640px){ .hero-plate-inner img{object-position:50% 50%} }

.hero-title-wrap{padding:1.75rem 1.5rem 0}
@media (min-width:640px){ .hero-title-wrap{padding:2rem 2.5rem 0} }
#hero-title{
  font-size:12.5vw;font-weight:500;text-transform:uppercase;
  line-height:0.85;letter-spacing:-0.02em;white-space:nowrap;
  color:var(--ink-deep);text-align:center;
}
/* "Йоґа. Точка опори" is half again as wide as the old single phrase; held on
   one row a phone would have to shrink it to a third of its size, so there it
   breaks after the first word instead and keeps the display scale. */
@media (max-width:640px){
  #hero-title{
    white-space:normal;
    display:flex;flex-wrap:wrap;justify-content:center;column-gap:0.26em;
  }
  #hero-title .clip:first-child{flex-basis:100%}
}

.hero-bottom{
  margin-top:auto;padding:0 1.5rem 2rem;
  display:flex;flex-direction:column;gap:1.5rem;
}
@media (min-width:640px){
  .hero-bottom{padding:0 2.5rem 2.5rem;flex-direction:row;justify-content:space-between;align-items:flex-end}
}

.hero-tagline{
  position:relative;isolation:isolate;
  font-size:1.9rem;font-weight:500;text-transform:uppercase;
  line-height:0.95;letter-spacing:-0.02em;color:var(--ink-deep);
}
@media (min-width:640px){ .hero-tagline{font-size:2.4rem} }
/* the two authored breaks are the design, so a line may not wrap into a third:
   holding them on one line each lets fitLines() measure the real width and
   scale the whole block down until it fits (see the script) */
.hero-tagline .line > span{white-space:nowrap}
/* the line sits low on the frame, where the floorboards go dark. A light
   pool, blurred until it has no edge at all, lifts it back off the photo. */
.hero-tagline::before{
  content:"";position:absolute;z-index:-1;
  inset:-1.5rem -2.75rem -1.25rem -2.25rem;
  border-radius:50%;
  background:rgba(246,241,232,0.82);
  filter:blur(2.25rem);
  pointer-events:none;
}
/* on phones the tagline rides under the title so the middle of the frame,
   where the figure is, stays free of type (see placeTagline in the script) */
.hero-title-wrap .hero-tagline{margin-top:0.875rem}
.hero-cluster{display:flex;align-items:flex-end;gap:1rem}

/* On phones the time card straddles the bottom edge of the banner: a quarter of
   it sits on the photo, the rest on the linen below. The banner gives up that
   overhang plus room for the floating CTA, so the whole card still lands above
   the fold. --cluster-h is measured in the script. */
@media (max-width:640px){
  .hero{
    overflow:visible;
    /* the section below is positioned too, so the banner has to be raised for
       the overhanging part of the card to stay on top of it */
    z-index:2;
    height:calc(100svh - 1rem - var(--hdr-h,0px) - 5rem - var(--cluster-h,12rem) * 0.75);
    min-height:22rem;
  }
  .hero-plate{border-radius:var(--radius-card-lg);overflow:hidden}
  .hero-bottom{padding-bottom:0}
  .hero-cluster{margin-bottom:calc(var(--cluster-h,12rem) * -0.75)}
}

.nextclass{
  width:100%;max-width:24rem;
  border:1px solid rgba(42,37,33,0.1);
  background:rgba(251,248,242,0.76);
  padding:1.125rem;border-radius:var(--radius-card);
  box-shadow:0 1.5rem 3rem rgba(42,37,33,0.16);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  display:flex;gap:1.125rem;align-items:stretch;
}
@media (min-width:640px){ .nextclass{max-width:23rem} }
.nextclass-left{display:flex;flex-direction:column;gap:0.125rem;flex:1;min-width:0}
.nextclass-time{display:flex;align-items:flex-start;gap:0.625rem}
.nextclass-value{font-size:3.25rem;font-weight:500;line-height:0.95;letter-spacing:-0.02em}
/* the source time belongs to the number above it, not to the caption below */
.nextclass-source{display:flex;align-items:center;gap:0.125rem}
/* the source time is one unit — with the hint beside it on a phone it would
   otherwise break after "18:30" */
.nextclass-cet{font-size:1.125rem;color:var(--brand);font-weight:500;letter-spacing:0.08em;white-space:nowrap;flex:none}
/* weekday over "online", two lines, pinned to the bottom of the card */
.nextclass-caption{
  font-size:1.0625rem;color:var(--ink-soft);display:flex;flex-direction:column;
  line-height:1.35;margin-top:auto;padding-top:0.75rem;
}

/* time-zone hint — sits on the source-time line, tap target kept at 2rem */
.info{
  position:relative;display:grid;place-items:center;flex:none;
  width:2rem;height:2rem;
  border-radius:var(--radius-pill);color:var(--ink-soft);
  transition:color 200ms ease;
}
.info:hover{color:var(--ink-deep)}
.info svg{width:1.25rem;height:1.25rem}
.info-tip{
  position:absolute;bottom:calc(100% + 0.5rem);left:50%;
  transform:translate(-50%,0.25rem);
  width:15rem;padding:0.75rem 0.875rem;
  border-radius:var(--radius-xl);
  background:var(--ink);color:var(--on-ink);
  font-size:0.875rem;line-height:1.5;font-weight:400;
  text-transform:none;letter-spacing:0;text-align:left;
  box-shadow:0 0.75rem 2rem rgba(42,37,33,0.3);
  opacity:0;pointer-events:none;
  transition:opacity 200ms ease,transform 200ms ease;
  z-index:5;
}
.info:hover .info-tip,.info:focus .info-tip{opacity:1;transform:translate(-50%,0)}
/* on phones a bubble anchored to the icon would run off the screen, so it
   spans the card instead and sits above it */
@media (max-width:640px){
  .nextclass{position:relative}
  .info{position:static}
  .info-tip{
    left:0.75rem;right:0.75rem;width:auto;bottom:calc(100% + 0.5rem);
    transform:translate(0,0.25rem);
  }
  .info:hover .info-tip,.info:focus .info-tip{transform:translate(0,0)}
}
.nextclass img{width:7.5rem;flex:none;aspect-ratio:3/4;object-fit:cover;border-radius:var(--radius-xl);height:auto}

/* ============================================================
   About (ghost headline + photo carousel)
   ============================================================ */
.about{
  position:relative;isolation:isolate;overflow:hidden;
  background:var(--background);
  padding:2.5rem 1.5rem 3rem;
}
@media (min-width:640px){ .about{padding:3rem 2.5rem} }
/* clears the part of the time card that hangs off the banner above */
@media (max-width:640px){ .about{padding-top:calc(3.5rem + var(--cluster-h,12rem) * 0.75)} }

/* "Про мене" card, now the left column of the Formats band */
.about-card{
  border-radius:var(--radius-card);background:var(--background);
  padding:1.75rem;align-self:start;will-change:transform,opacity;
}
.badge-chip{
  display:inline-block;border-radius:var(--radius-xl);background:var(--surface);
  padding:0.5rem 1rem;font-size:1.25rem;font-weight:500;
}
.about-card h3{font-size:1.75rem;font-weight:500;letter-spacing:-0.02em}
.about-card p{font-size:1.0625rem;color:var(--ink-soft);line-height:1.75;margin-top:0.875rem}

#about-title{
  position:relative;z-index:0;pointer-events:none;user-select:none;-webkit-user-select:none;
  max-width:88rem;margin:0 auto;
  /* the ghost rows now carry a quote broken into phrases, not single words, so
     the row runs wider than it used to and the display size gives way to it */
  font-size:7.3vw;font-weight:500;text-transform:uppercase;
  line-height:1.02;letter-spacing:-0.02em;
}
.ghost-row{display:flex;justify-content:space-between;align-items:baseline}
.gw{display:inline-block;color:var(--ghost);will-change:transform}
.gw--ink{color:var(--ink)}

/* Per-slide typesetting. The three parts of the quote are different lengths and
   the photo floats in the middle of the rows, so each slide gets the size and
   the frame position that keep the words clear of it — paintAbout() stamps the
   slide index on both the headline and the stage. */
#about-title[data-slide="0"] .ghost-row:nth-child(2),
#about-title[data-slide="2"] .ghost-row:nth-child(2){font-size:0.74em}
/* on the last slide the accent belongs to "всесвіт", the word that closes the
   quote, not to "всередині" */
#about-title[data-slide="2"] .gw[data-gw="2"]{color:var(--ghost)}
#about-title[data-slide="2"] .gw[data-gw="3"]{color:var(--ink)}

.about-stage{position:relative}
.about-photo{position:relative;z-index:10;width:12rem;margin:2rem auto 0}
@media (min-width:640px){
  .about-photo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:13.5rem;margin:0}
  /* slide 2 puts one long word on the ink row, slide 3 leaves a gap between the
     two words of the top row — the frame moves into the free space */
  .about-stage[data-slide="1"] .about-photo{left:72%}
  .about-stage[data-slide="2"] .about-photo{left:57%}
}
.about-photo-fig{
  position:relative;transform:rotate(6deg);
  aspect-ratio:3/4;border-radius:var(--radius-card);
  background:var(--surface);overflow:hidden;
  box-shadow:0 1.5rem 3rem rgba(42,37,33,0.2);
}
/* the frame doubles as the mask: the photo rises into it exactly the way a
   display line rises into its own clip (see .clip in the reveal primitives) */
.about-photo-inner{
  width:100%;height:100%;
  transform:translateY(115%);opacity:0;
  will-change:transform,opacity;
}
.about-photo-fig.is-in .about-photo-inner{transform:translateY(0);opacity:1}
.about-photo-fig img{width:100%;height:100%;object-fit:cover}
.photo-cap{
  position:absolute;left:0.75rem;right:0.75rem;bottom:0.75rem;
  border-radius:var(--radius-xl);
  background:rgba(42,37,33,0.55);color:var(--on-ink);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  padding:0.5rem 0.75rem;
}
.photo-cap b{display:block;font-size:1.125rem;font-weight:500}
.photo-cap span{display:block;font-size:0.875rem;opacity:0.8}

.about-controls{position:relative;z-index:20;margin-top:2rem;display:flex;align-items:center;justify-content:space-between}
@media (min-width:640px){ .about-controls{margin-top:2.5rem} }

/* ============================================================
   Formats
   ============================================================ */
.formats{background:var(--surface);padding:5rem 1.5rem}
@media (min-width:640px){ .formats{padding:6rem 2.5rem} }
.formats-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:2.5rem}
@media (min-width:1024px){
  .formats-layout{grid-template-columns:repeat(12,minmax(0,1fr));gap:3rem}
  .about-card{grid-column:span 4}
  .formats-main{grid-column:span 8}
}
#formats-title{font-size:3rem;font-weight:500;line-height:0.95;letter-spacing:-0.02em;margin-top:1rem}
.format-list{margin-top:2.5rem}
.format-list{margin-left:-1.25rem;margin-right:-1.25rem}
.format-row{position:relative;display:block;border-top:1px solid var(--hairline);overflow:hidden}
.format-list li:last-child .format-row{border-bottom:1px solid var(--hairline)}
/* the whole row fills with ink, wiping upward */
.format-row::before{
  content:"";position:absolute;inset:0;background:var(--ink);z-index:0;
  transform:translateY(100%);
  transition:transform 520ms cubic-bezier(0.16,1,0.3,1);
}
.format-inner{
  position:relative;z-index:1;
  display:flex;align-items:center;gap:1.5rem;padding:1.75rem 1.25rem;
  will-change:transform,opacity;transition:color 320ms ease;
}
@media (hover:hover){
  .format-row:hover::before,.format-row:focus-visible::before{transform:translateY(0)}
  .format-row:hover .format-inner,.format-row:focus-visible .format-inner{color:var(--on-ink)}
  .format-row:hover .format-index,.format-row:focus-visible .format-index,
  .format-row:hover .format-desc,.format-row:focus-visible .format-desc{color:rgba(246,241,232,0.72)}
  .format-row:hover .format-arrow,.format-row:focus-visible .format-arrow{border-color:rgba(246,241,232,0.45)}
}
.format-index{width:2.5rem;flex:none;font-size:1.125rem;font-weight:500;color:var(--ink-soft);transition:color 320ms ease}
.format-copy{flex:1;min-width:0}
.format-name{display:block;font-size:1.5rem;font-weight:500;letter-spacing:-0.02em}
@media (min-width:640px){ .format-name{font-size:1.875rem} }
.format-desc{display:block;font-size:1.125rem;color:var(--ink-soft);margin-top:0.25rem;transition:color 320ms ease}
.format-arrow{
  width:2.75rem;height:2.75rem;flex:none;display:grid;place-items:center;
  border-radius:var(--radius-pill);border:1px solid var(--hairline);
  transition:border-color 320ms ease;
}
.format-arrow svg{width:1.25rem;height:1.25rem;will-change:transform,opacity}

/* ============================================================
   Who it's for
   ============================================================ */
.forwhom{
  background:var(--background);border-radius:var(--radius-card-lg);
  margin-top:-2.5rem;position:relative;z-index:1;
  padding:4rem 1.5rem 5rem;
}
@media (min-width:640px){ .forwhom{padding:4rem 2.5rem 5rem} }
.fw-grid{display:grid;grid-template-columns:1fr;gap:2.5rem;align-items:end}
@media (min-width:768px){ .fw-grid{grid-template-columns:1fr 1fr} }
.fw-intro{max-width:24rem}
.fw-icon{width:4rem;height:4rem;border-radius:var(--radius-card);object-fit:cover;will-change:transform,opacity}
#forwhom-title{font-size:3rem;font-weight:500;line-height:0.95;letter-spacing:-0.02em;margin-top:1.5rem}
.fw-body{font-size:1.125rem;color:var(--ink-soft);max-width:20rem;margin-top:1.5rem;line-height:1.7}

.fw-cards{display:flex;align-items:flex-end;gap:1.25rem}
.fw-card{flex:1;min-width:0;will-change:transform,opacity}
.fw-card--2{margin-bottom:2rem}
.fw-tile{position:relative;display:block;aspect-ratio:3/4;border-radius:var(--radius-card);overflow:hidden;background:var(--surface)}
.fw-tile img{width:100%;height:100%;object-fit:cover;will-change:transform}
.fw-cap{
  position:absolute;left:0.75rem;right:0.75rem;bottom:0.75rem;
  border-radius:var(--radius-xl);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  color:var(--on-ink);padding:0.75rem 1rem;
}
.fw-cap--sage{background:rgba(140,154,128,0.72)}
.fw-cap--clay{background:rgba(42,37,33,0.55)}
.fw-cap b{display:block;font-size:1.125rem;font-weight:500}
.fw-cap span{display:block;font-size:0.875rem;opacity:0.9;margin-top:0.125rem}

/* on phones the tiles are too narrow to carry a label on top of the photo,
   so the caption steps out from under the glass and sits below the image */
@media (max-width:640px){
  .fw-cards{align-items:flex-start}
  .fw-card--2{margin-bottom:0;margin-top:2rem}
  .fw-tile{aspect-ratio:auto;overflow:visible;border-radius:0;background:none}
  .fw-tile img{aspect-ratio:3/4;border-radius:var(--radius-card);background:var(--surface)}
  .fw-cap{
    position:static;padding:0.75rem 0 0;border-radius:0;
    background:none;color:var(--ink);
    -webkit-backdrop-filter:none;backdrop-filter:none;
  }
  .fw-cap span{color:var(--ink-soft);opacity:1}
}

/* ============================================================
   "Для тебе" band (dark)
   ============================================================ */
/* two separate dark cards sharing one row: the promises 9 columns, links 3 */
.dark-row{display:grid;grid-template-columns:minmax(0,1fr);gap:0.75rem;margin-top:0.75rem}
@media (min-width:1024px){
  .dark-row{grid-template-columns:repeat(12,minmax(0,1fr))}
  .facts{grid-column:span 9}
  .socials-band{grid-column:span 3}
}
.facts{
  background:var(--ink);color:var(--on-ink);
  border-radius:var(--radius-card-lg);
  padding:3.5rem 1.5rem;
}
@media (min-width:640px){ .facts{padding:4rem 2.5rem} }
#facts-title{font-size:3rem;font-weight:500;line-height:0.95;letter-spacing:-0.02em;margin-top:1rem}
/* four promises, set large — they carry the band on their own now that the
   counters (19 / 9) live in the "Про мене" card instead */
.facts-grid{display:grid;grid-template-columns:minmax(0,1fr);column-gap:3rem;row-gap:2rem;margin-top:3rem}
@media (min-width:768px){ .facts-grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
.fact{border-top:1px solid rgba(246,241,232,0.2);padding-top:1.25rem;will-change:transform,opacity}
.fact-line{display:block;font-size:1.75rem;font-weight:500;letter-spacing:-0.02em;line-height:1.14}
@media (min-width:640px){ .fact-line{font-size:2.125rem} }

/* the social links keep their own dark card beside the numbers */
.socials-band{
  background:var(--ink);color:var(--on-ink);
  border-radius:var(--radius-card-lg);
  padding:2.5rem 1.5rem;
  display:flex;
}
@media (min-width:640px){ .socials-band{padding:2.5rem} }
.socials{display:flex;flex-direction:column;gap:1.25rem;width:100%}
@media (min-width:768px) and (max-width:1023px){
  .socials{flex-direction:row;align-items:center;justify-content:space-between}
}
@media (min-width:1024px){ .socials{justify-content:center} .socials-list{flex-direction:column;flex-wrap:nowrap} }
.socials-title{font-size:3rem;font-weight:500;line-height:0.95;letter-spacing:-0.02em;color:var(--on-ink)}
.socials-list{display:flex;flex-wrap:wrap;gap:0.75rem}

.social-logo{width:1.5rem;height:1.5rem;flex:none;border-radius:var(--radius-pill);object-fit:cover;background:var(--on-ink)}
/* in.yoga wears the federation's lotus, in the logo's grey */
.social-logo--lotus{
  background:var(--uy-grey);border-radius:0;
  -webkit-mask:url(assets/ufy-mark.png) center/contain no-repeat;
          mask:url(assets/ufy-mark.png) center/contain no-repeat;
}
.socials-list a{
  display:inline-flex;align-items:center;gap:0.5rem;
  border:1px solid rgba(246,241,232,0.25);border-radius:var(--radius-pill);
  padding:0.625rem 1.125rem;font-size:1.125rem;
  transition:background-color 220ms ease,border-color 220ms ease,color 220ms ease;
}
.socials-list a:hover{background:var(--on-ink);border-color:var(--on-ink);color:var(--ink)}
.socials-list svg{width:1.125rem;height:1.125rem;flex:none}

/* ============================================================
   Yoga essay (her own words, beside the asana video)
   ============================================================ */
.letter{background:var(--background);padding:5rem 1.5rem}
@media (min-width:640px){ .letter{padding:6rem 2.5rem} }
#letter-title{font-size:3rem;font-weight:500;line-height:0.95;letter-spacing:-0.02em;margin-top:1rem}
.letter{padding-top:4rem}
.letter-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:2.5rem;align-items:start}
@media (min-width:1024px){
  .letter-grid{grid-template-columns:repeat(12,minmax(0,1fr));gap:3rem;align-items:stretch}
}
.letter-head{align-self:start}
.letter-photo{
  border-radius:var(--radius-card);overflow:hidden;aspect-ratio:3/4;
  background:var(--surface);will-change:transform,opacity;min-width:0;
}
/* One empty column on each side pulls the block off the page edges and towards
   the middle: photo 4 columns starting at the second, the essay 6 after it.
   Declared after the base rule above so `aspect-ratio:auto` wins — with 3/4
   still applied the figure would size itself from the row height and spill over
   the text. */
@media (min-width:1024px){
  .letter-photo{grid-column:2 / span 4;aspect-ratio:auto;height:100%}
  .letter-main{grid-column:span 6}
}
.letter-photo img,.letter-photo video{width:100%;height:100%;object-fit:cover;display:block}
/* one column, set at reading size. The measure lives on the paragraphs, not on
   the block, so the opening line can use the full width of the cell above them. */
.letter-body{will-change:transform,opacity;margin-top:1.75rem}
.letter-body p,.letter-body ul{max-width:42rem}
.letter-body p{font-size:1.1875rem;line-height:1.75;color:var(--ink)}
.letter-body p + p{margin-top:1.25rem}
.letter-body ul + p{margin-top:1.25rem}
.letter-body ul{margin-top:1.25rem;display:flex;flex-direction:column;gap:0.875rem}
.letter-body li{
  font-size:1.1875rem;line-height:1.7;padding-left:1.5rem;position:relative;color:var(--ink);
}
.letter-body li::before{
  content:"";position:absolute;left:0;top:0.72em;
  width:0.5rem;height:0.5rem;border-radius:var(--radius-pill);background:var(--brand);
}
/* The opening question is the display line of the block: two lines held by a
   measure, with the question mark set two lines tall at the end of the phrase.
   Scoped through .letter-body so it outweighs the `.letter-body p` rule above. */
.letter-body .letter-lead{
  font-size:1.75rem;line-height:1.25;font-weight:500;letter-spacing:-0.02em;
  color:var(--ink-deep);
  /* the cell is what breaks it into two lines; balance evens them out */
  max-width:none;text-wrap:balance;
  margin-bottom:2.25rem;
}
/* sized so the Ukrainian line — the longer of the two — still sets in two lines
   inside the narrower column */
@media (min-width:640px){ .letter-body .letter-lead{font-size:1.875rem} }
.letter-body .letter-lead + p{margin-top:0}

/* ============================================================
   Dance block
   ============================================================ */
.dance{
  background:var(--surface);border-radius:var(--radius-card-lg);
  margin-top:0.75rem;padding:3.5rem 1.5rem;
}
@media (min-width:640px){ .dance{padding:4rem 2.5rem} }
.dance-grid{display:grid;grid-template-columns:1fr;gap:2rem;align-items:center}
@media (min-width:768px){ .dance-grid{grid-template-columns:1.4fr 1fr;gap:3rem} }
#dance-title{font-size:2.25rem;font-weight:500;line-height:0.95;letter-spacing:-0.02em;margin-top:1rem}
@media (min-width:640px){ #dance-title{font-size:3rem} }
.dance-body{font-size:1.125rem;color:var(--ink-soft);line-height:1.7;margin-top:1.25rem;max-width:32rem}
.dance-photo{
  border-radius:var(--radius-card);overflow:hidden;aspect-ratio:1/1;
  background:var(--background);will-change:transform,opacity;
}
.dance-photo img{width:100%;height:100%;object-fit:cover}

/* ============================================================
   Footer
   ============================================================ */
.footer{
  background:var(--ink);color:var(--on-ink);
  border-radius:var(--radius-card-lg);margin-top:0.75rem;
  padding:3.5rem 1.5rem;
}
@media (min-width:640px){ .footer{padding:4rem 2.5rem} }
/* on phones the floating CTA comes back once the footer's own call to action
   has scrolled past, so the dark block grows a landing strip for it under the
   Covent AI logo */
@media (max-width:640px){ .footer{padding-bottom:8rem} }

.footer-cta{border-bottom:1px solid rgba(246,241,232,0.15);padding-bottom:3.5rem;display:flex;flex-direction:column;gap:1.5rem}
@media (min-width:640px){ .footer-cta{flex-direction:row;justify-content:space-between;align-items:flex-end} }
.footer-cta p{font-size:3.75rem;font-weight:500;line-height:0.92;letter-spacing:-0.02em;margin-top:1rem}
.footer-cta .pill{will-change:transform,opacity}

.footer-cols{padding:3.5rem 0;display:grid;grid-template-columns:1fr;gap:2.5rem}
@media (min-width:768px){ .footer-cols{grid-template-columns:1.4fr 1fr 1fr 1fr} }
.footer-brand{max-width:20rem}
.footer-brand-row{display:flex;align-items:center;gap:0.75rem;font-size:1.375rem;font-weight:500;text-transform:uppercase;letter-spacing:0}
.footer-uy{height:2.5rem}
.footer-blurb{font-size:1.125rem;color:rgba(246,241,232,0.65);margin-top:1rem;line-height:1.6}
.footer-col h3{font-size:0.875rem;font-weight:500;text-transform:uppercase;letter-spacing:0.2em;color:rgba(246,241,232,0.5)}
.footer-col ul{margin-top:1rem;font-size:1.125rem;color:rgba(246,241,232,0.8);display:flex;flex-direction:column;gap:0.75rem}
.footer-col a:hover{color:var(--on-ink);text-decoration:underline}

.footer-bottom{
  border-top:1px solid rgba(246,241,232,0.15);padding-top:2rem;
  font-size:1.125rem;color:rgba(246,241,232,0.6);
  display:flex;flex-direction:column;gap:1.25rem;
}
@media (min-width:640px){ .footer-bottom{flex-direction:row;justify-content:space-between;align-items:center} }
.footer-bottom nav{display:flex;gap:1.25rem;flex-wrap:wrap}
.footer-bottom a:hover{color:var(--on-ink)}

.covent{display:inline-flex;align-items:center;gap:0.75rem}
.covent-by{font-size:0.875rem;color:rgba(246,241,232,0.45)}
.covent-logo{
  height:1.75rem;width:auto;border-radius:0.375rem;display:block;
  opacity:0.9;transition:opacity 220ms ease;
}
.covent:hover .covent-logo{opacity:1}

/* ============================================================
   Menu overlay
   ============================================================ */
.menu{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;pointer-events:none}
.menu.is-open{pointer-events:auto}
.menu-backdrop{position:absolute;inset:0;background:var(--background);opacity:0}
.menu-panel{position:relative;flex:1;display:flex;flex-direction:column;color:var(--ink-deep);padding:var(--page-inset);opacity:0;will-change:transform,opacity}
.menu-inner{flex:1;display:flex;flex-direction:column;padding:1.5rem}
@media (min-width:640px){ .menu-inner{padding:2rem 2.5rem 2.5rem} }
.menu-top{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.menu-brand{display:flex;align-items:center;gap:0.75rem;font-size:1.375rem;font-weight:500;text-transform:uppercase;letter-spacing:0}
.menu-uy{height:2.25rem}
.icon-close{
  width:2.5rem;height:2.5rem;flex:none;display:grid;place-items:center;
  border-radius:var(--radius-pill);background:rgba(246,241,232,0.15);
  transition:background-color 220ms ease;
}
.icon-close:hover{background:rgba(246,241,232,0.25)}
.icon-close svg{width:1.25rem;height:1.25rem;will-change:transform}
/* the menu sits on linen, so its chrome flips to ink */
.menu .icon-close{background:rgba(42,37,33,0.1);color:var(--ink-deep)}
.menu .icon-close:hover{background:rgba(42,37,33,0.2)}
.menu-nav{flex:1;display:flex;flex-direction:column;justify-content:center;gap:0.5rem}
.menu-nav a{display:block;font-size:2.25rem;font-weight:500;letter-spacing:-0.02em;line-height:1.15;transition:color 220ms ease;will-change:transform,opacity}
@media (min-width:640px){ .menu-nav a{font-size:4rem} }
.menu-nav a:hover{color:var(--brand)}
.menu-bottom{border-top:1px solid rgba(42,37,33,0.15);padding-top:2rem;display:flex;flex-direction:column;gap:1.25rem}
@media (min-width:640px){ .menu-bottom{flex-direction:row;justify-content:space-between;align-items:center} }
.menu-social{display:flex;gap:1.25rem;font-size:1.125rem;color:var(--ink-soft);align-items:center}
.menu-social a:hover{color:var(--ink-deep)}
.menu .lang button[aria-pressed="true"]{background:rgba(42,37,33,0.12)}
.menu .pill--light{background:var(--ink);color:var(--on-ink)}
.menu .pill--light:hover{background:var(--brand);color:var(--on-ink)}

/* ============================================================
   Sticky booking CTA
   ============================================================ */
.sticky-cta{
  position:fixed;left:50%;bottom:calc(1.25rem + env(safe-area-inset-bottom));
  z-index:60;
  display:inline-flex;align-items:center;gap:0.5rem;
  border-radius:var(--radius-pill);
  background:var(--ink);color:var(--on-ink);
  padding:0.875rem 1.75rem;
  font-size:1.125rem;font-weight:500;text-transform:uppercase;letter-spacing:0.05em;
  white-space:nowrap;
  box-shadow:0 1rem 2.5rem rgba(42,37,33,0.3);
  transform:translate(-50%,150%);opacity:0;pointer-events:none;
  transition:transform 460ms cubic-bezier(0.16,1,0.3,1),opacity 300ms ease,background-color 220ms ease;
}
.sticky-cta.is-visible{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.sticky-cta:hover{background:var(--brand)}
.sticky-cta svg{width:1rem;height:1rem;flex:none}
/* line the button up with the bottom edge of the time card; only from the width
   where the centred button clears the right-hand card */
@media (min-width:1100px){
  .sticky-cta{bottom:calc(var(--page-inset) + 2.5rem)}
}
@media (prefers-reduced-motion:reduce){ .sticky-cta{transition:opacity 200ms ease} }

/* ============================================================
   Loader
   ============================================================ */
.loader{
  position:fixed;inset:0;z-index:200;
  background:var(--background);color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2rem;
  will-change:transform;
}
.loader-mark{
  display:flex;flex-direction:column;align-items:center;gap:1.25rem;
  font-size:1.625rem;font-weight:500;text-transform:uppercase;letter-spacing:0;
  opacity:0;will-change:transform,opacity;text-align:center;
}
/* the lockup stands over the name; the wordmark stays the loudest thing here */
.loader-uy{height:5.25rem}
.loader-track{width:10rem;height:1px;border-radius:var(--radius-pill);background:rgba(42,37,33,0.2);overflow:hidden}

/* the displacement map the header's glass reads from — never painted itself */
.glass-defs{position:absolute;width:0;height:0;overflow:hidden;pointer-events:none}
.loader-fill{display:block;width:100%;height:100%;background:var(--brand);transform:scaleX(0);transform-origin:left}
</style>

   Constants
   ============================================================ */
const EASE = {
  easeOutExpo:    'cubic-bezier(0.16, 1, 0.3, 1)',
  easeOutQuart:   'cubic-bezier(0.25, 1, 0.5, 1)',
  easeInOutCubic: 'cubic-bezier(0.65, 0, 0.35, 1)',
};
const LOADER = { MIN_VISIBLE_MS: 1400, MAX_VISIBLE_MS: 2600, EXIT_MS: 850, FILL_DELAY: 120 };
const GHOST_STAGGER = 90;

const isMobile = () => window.innerWidth <= 768;

/* ============================================================
   Lenis + scroll lock
   ============================================================ */
const lenis = new Lenis({ smoothWheel: true });
let scrollLocks = 0;
function lockScroll() {
  scrollLocks += 1;
  if (scrollLocks === 1) { lenis.stop(); document.documentElement.classList.add('is-locked'); }
}
function unlockScroll() {
  scrollLocks = Math.max(0, scrollLocks - 1);
  if (scrollLocks === 0) { lenis.start(); document.documentElement.classList.remove('is-locked'); }
}
window.scrollTo(0, 0);

/* ============================================================
   Spring helper
   ============================================================ */
const MOTIONS = new Set();
const EPS = { opacity: 0.0006, scale: 0.0006, x: 0.02, y: 0.02, rotate: 0.02 };

function applyTransform(el, p) {
  let t = '';
  if (p.x !== undefined) t += `translateX(${p.x}px) `;
  if (p.y !== undefined) t += `translateY(${p.y}px) `;
  if (p.scale !== undefined) t += `scale(${p.scale}) `;
  if (p.rotate !== undefined) t += `rotate(${p.rotate}deg) `;
  if (t) el.style.transform = t.trim();
  if (p.opacity !== undefined) el.style.opacity = p.opacity;
}

class Motion {
  constructor(el, from, config = {}, apply = applyTransform) {
    this.el = el; this.apply = apply;
    this.tension = config.tension ?? 170;
    this.friction = config.friction ?? 26;
    this.keys = Object.keys(from);
    this.props = { ...from }; this.targets = { ...from }; this.vel = {};
    for (const k of this.keys) this.vel[k] = 0;
    this.awake = false;
    MOTIONS.add(this);
    this.render();
  }
  set(state) { for (const k in state) { this.props[k] = state[k]; this.targets[k] = state[k]; this.vel[k] = 0; } this.render(); }
  to(state) { for (const k in state) this.targets[k] = state[k]; this.awake = true; }
  step(dt) {
    if (!this.awake) return;
    const sub = Math.max(1, Math.ceil(dt * 240));
    const h = dt / sub;
    let moving = false;
    for (const k of this.keys) {
      let x = this.props[k], v = this.vel[k];
      const tg = this.targets[k];
      for (let i = 0; i < sub; i++) {
        const a = -this.tension * (x - tg) - this.friction * v;
        v += a * h; x += v * h;
      }
      const e = EPS[k] ?? 0.001;
      if (Math.abs(x - tg) > e || Math.abs(v) > e * 12) moving = true;
      else { x = tg; v = 0; }
      this.props[k] = x; this.vel[k] = v;
    }
    this.render();
    if (!moving) this.awake = false;
  }
  render() { this.apply(this.el, this.props); }
}

function inview(el, from, to, config, delayIn = 0, apply) {
  const m = new Motion(el, from, config, apply);
  const io = new IntersectionObserver((entries) => {
    for (const e of entries) {
      if (!e.isIntersecting) continue;
      io.disconnect();
      if (delayIn > 0) setTimeout(() => m.to(to), delayIn); else m.to(to);
    }
  }, { threshold: 0.08, rootMargin: '0px 0px -4% 0px' });
  io.observe(el);
  return m;
}

function hover(trigger, target, from, to, config, apply) {
  const m = new Motion(target, from, config, apply);
  const enter = () => { if (!isMobile()) m.to(to); };
  const leave = () => m.to(from);
  trigger.addEventListener('pointerenter', enter);
  trigger.addEventListener('pointerleave', leave);
  trigger.addEventListener('focusin', enter);
  trigger.addEventListener('focusout', leave);
  return m;
}

/* ============================================================
   Scroll parallax
   ============================================================ */
const PARALLAX = [];
function addParallax(measureEl, targetEl, axis, from, to, unit) {
  PARALLAX.push({ measureEl, targetEl, axis, from, to, unit });
}
function updateParallax() {
  const vh = window.innerHeight;
  for (const p of PARALLAX) {
    const r = p.measureEl.getBoundingClientRect();
    const total = r.height + vh;
    if (total <= 0) continue;
    let t = (vh - r.top) / total;
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    p.targetEl.style.transform = `translate${p.axis}(${p.from + (p.to - p.from) * t}${p.unit})`;
  }
}

let lastT = performance.now();
function raf(t) {
  lenis.raf(t);
  let dt = (t - lastT) / 1000; lastT = t;
  if (dt > 0.064) dt = 0.064;
  if (dt > 0) for (const m of MOTIONS) m.step(dt);
  updateParallax();
  requestAnimationFrame(raf);
}
requestAnimationFrame(raf);

/* ============================================================
   Reveal primitives
   ============================================================ */
function buildParts(host, pieces, kind) {
  host.textContent = '';
  const items = [];
  pieces.forEach((piece, i) => {
    const clip = document.createElement('span');
    clip.className = kind === 'lines' ? 'line' : (kind === 'wordfade' ? 'wf' : 'clip');
    const inner = document.createElement('span');
    inner.textContent = piece;
    clip.appendChild(inner);
    host.appendChild(clip);
    if (kind !== 'lines' && i < pieces.length - 1) host.appendChild(document.createTextNode(' '));
    items.push({ clip, inner });
  });
  return items;
}

function play(items, { stagger = 120, duration = 950, easing = EASE.easeOutExpo, delay = 0 } = {}) {
  if (!items.length) return;
  items.forEach(({ clip, inner }) => { clip.classList.remove('is-in'); inner.style.transition = 'none'; });
  void items[0].inner.offsetWidth;
  items.forEach(({ inner }, i) => {
    inner.style.transition = `transform ${duration}ms ${easing}, opacity ${duration}ms ${easing}`;
    inner.style.transitionDelay = `${delay + i * stagger}ms`;
  });
  requestAnimationFrame(() => {
    requestAnimationFrame(() => items.forEach(({ clip }) => clip.classList.add('is-in')));
  });
}

function showInstant(items) {
  items.forEach(({ clip, inner }) => {
    inner.style.transition = 'none';
    inner.style.transitionDelay = '0ms';
    clip.classList.add('is-in');
  });
}

/* --- class time: anchored to 18:30 in Central Europe, rendered in the
   visitor's own zone --- */
const CLASS_TZ = 'Europe/Stockholm';   // the teacher's zone; carries CET/CEST for us
const CLASS_HOUR = 18, CLASS_MINUTE = 30;

/* how far the given instant sits from UTC inside `tz` */
function tzOffsetMs(ts, tz) {
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: tz, hour12: false,
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit',
  }).formatToParts(ts).reduce((o, x) => (x.type === 'literal' ? o : (o[x.type] = x.value, o)), {});
  const asUTC = Date.UTC(parts.year, parts.month - 1, parts.day, parts.hour % 24, parts.minute, parts.second);
  return asUTC - ts;
}

/* the instant of the next Wednesday 18:30 in CLASS_TZ */
function nextClassInstant(now = new Date()) {
  const probe = new Date(now.getTime());
  for (let i = 0; i < 9; i++) {
    const y = probe.getUTCFullYear(), m = probe.getUTCMonth(), d = probe.getUTCDate();
    let ts = Date.UTC(y, m, d, CLASS_HOUR, CLASS_MINUTE);
    for (let k = 0; k < 3; k++) ts = Date.UTC(y, m, d, CLASS_HOUR, CLASS_MINUTE) - tzOffsetMs(ts, CLASS_TZ);
    const wd = new Intl.DateTimeFormat('en-US', { timeZone: CLASS_TZ, weekday: 'short' }).format(ts);
    if (wd === 'Wed' && ts > now.getTime()) return new Date(ts);
    probe.setUTCDate(probe.getUTCDate() + 1);
  }
  return null;
}

function renderClassTime() {
  const when = nextClassInstant();
  const valueEl = document.getElementById('nextclass-value');
  const dayEl = document.getElementById('nextclass-day');
  const tipEl = document.getElementById('tz-tip');
  const locale = lang === 'uk' ? 'uk-UA' : 'en-GB';
  let zone = 'UTC';
  try { zone = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC'; } catch (e) { /* keep UTC */ }

  if (when) {
    valueEl.textContent = new Intl.DateTimeFormat(locale, { hour: '2-digit', minute: '2-digit', hour12: false }).format(when);
    const day = new Intl.DateTimeFormat(locale, { weekday: 'long' }).format(when);
    dayEl.textContent = day.charAt(0).toUpperCase() + day.slice(1);
  }
  const note = t('hero.tzNote');
  if (typeof note === 'string') tipEl.textContent = note.replace('{tz}', zone.replace(/_/g, ' '));
}

addParallax(heroSection, document.getElementById('hero-plate-inner'), 'Y', 0, 12, '%');

/* the display line is set in vw and must not be clipped by its padded box */
function fitHeroTitle() {
  heroTitleEl.style.fontSize = '';
  const avail = heroTitleEl.clientWidth;
  if (avail <= 0) return;

  /* On phones the first word takes a row of its own (see the CSS) and the rest
     share the row under it. Flex would break that second row apart instead of
     scaling it, so the fit is measured against the words themselves. */
  if (window.matchMedia('(max-width:640px)').matches) {
    const clips = [...heroTitleEl.querySelectorAll('.clip')];
    if (clips.length < 2) return;
    const gap = parseFloat(getComputedStyle(heroTitleEl).columnGap) || 0;
    const rest = clips.slice(1).reduce((s, c) => s + c.getBoundingClientRect().width, 0)
      + gap * (clips.length - 2);
    /* two pixels of slack: scaled to the exact width, sub-pixel rounding still
       breaks the row apart */
    if (rest > avail - 2) {
      const base = parseFloat(getComputedStyle(heroTitleEl).fontSize);
      heroTitleEl.style.fontSize = `${base * ((avail - 2) / rest)}px`;
    }
    return;
  }

  const natural = heroTitleEl.scrollWidth;
  if (natural > avail) {
    const base = parseFloat(getComputedStyle(heroTitleEl).fontSize);
    heroTitleEl.style.fontSize = `${base * (avail / natural)}px`;
  }
}

/* Stacked display lines are clipped by their reveal mask, so a single long word
   (Ukrainian sets far longer than English) would silently lose its tail. Scale
   the block down until the widest line fits. */
function fitLines(el) {
  el.style.fontSize = '';
  const spans = el.querySelectorAll('.line > span');
  if (!spans.length) return;
  const avail = el.clientWidth;
  if (avail <= 0) return;
  let widest = 0;
  spans.forEach((s) => { if (s.scrollWidth > widest) widest = s.scrollWidth; });
  if (widest > avail) {
    const base = parseFloat(getComputedStyle(el).fontSize);
    el.style.fontSize = `${base * (avail / widest)}px`;
  }
}
function fitAllLines() {
  fitHeroTitle();
  document.querySelectorAll('[data-reveal="lines"]').forEach(fitLines);
}

/* On phones the hero photo fills the full height, so type at both the top and
   the bottom would always land on the figure. Move the tagline up under the
   title and leave the middle of the frame clear. */
const mqPhone = matchMedia('(max-width: 640px)');
const taglineEl = document.getElementById('hero-tagline');
const heroTitleWrap = document.querySelector('.hero-title-wrap');
const heroBottomEl = document.querySelector('.hero-bottom');
function placeTagline() {
  if (mqPhone.matches) {
    if (taglineEl.parentElement !== heroTitleWrap) heroTitleWrap.appendChild(taglineEl);
  } else if (taglineEl.parentElement !== heroBottomEl) {
    heroBottomEl.insertBefore(taglineEl, heroBottomEl.firstChild);
  }
  fitAllLines();
}
placeTagline();
mqPhone.addEventListener('change', placeTagline);
document.fonts.ready.then(fitAllLines);
window.addEventListener('resize', fitAllLines);

/* ============================================================
   About carousel + ghost words
   ============================================================ */
const aboutSection = document.querySelector('.about');
const aboutTitleEl = document.getElementById('about-title');
const aboutStageEl = document.querySelector('.about-stage');
const gwEls = [...document.querySelectorAll('#about-title .gw')];
const gwParallax = [[-3, 3], [3, -3], [-2, 4], [4, -3]];
gwEls.forEach((el, i) => addParallax(aboutSection, el, 'X', gwParallax[i][0], gwParallax[i][1], '%'));
const gwItems = gwEls.map((el) => {
  const clip = el.querySelector('.clip');
  return { clip, inner: clip.firstElementChild };
});

const aboutImg = document.getElementById('about-img');
const aboutCapTitle = document.getElementById('about-cap-title');
const aboutCapSub = document.getElementById('about-cap-sub');
const aboutDots = document.getElementById('about-dots');
let aboutIndex = 0;

/* the photo rides the same reveal primitive as the display type: the frame is
   the clip, the inner block is the line that rises into it */
const aboutPhotoItems = [{
  clip: document.getElementById('about-photo-fig'),
  inner: document.getElementById('about-photo-inner'),
}];
const ABOUT_PHOTO_PLAY = { stagger: 0, duration: 950, easing: EASE.easeOutExpo, delay: 120 };

function paintAbout(i, animateGhost) {
  const photos = t('about.photos');
  const ghost = t('about.ghost');
  const p = photos[i];
  /* the per-slide type size, the accent word and the frame position are all
     CSS, keyed off this index (see the About block in the stylesheet) */
  aboutTitleEl.dataset.slide = String(i);
  aboutStageEl.dataset.slide = String(i);
  aboutImg.src = p.img; aboutImg.alt = p.alt;
  aboutCapTitle.textContent = p.title;
  aboutCapSub.textContent = p.sub;
  gwItems.forEach((it, n) => { it.inner.textContent = ghost[i][n]; });
  if (animateGhost) {
    play(gwItems, { stagger: GHOST_STAGGER, duration: 700, easing: EASE.easeOutExpo });
    play(aboutPhotoItems, ABOUT_PHOTO_PLAY);
  }

  if (aboutDots.children.length !== photos.length) {
    aboutDots.textContent = '';
    photos.forEach((_, n) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.innerHTML = '<i></i>';
      b.addEventListener('click', () => goAbout(n));
      aboutDots.appendChild(b);
    });
  }
  [...aboutDots.children].forEach((b, n) => {
    b.setAttribute('aria-current', String(n === i));
    b.setAttribute('aria-label', photos[n].title);
  });
}

/* every slide is in the cache before the first click, so the frame is never
   empty while the new photo rises into it */
[...new Set(['uk', 'en'].flatMap((l) => T[l].about.photos.map((p) => p.img)))]
  .forEach((src) => { const im = new Image(); im.src = src; });

function goAbout(i) {
  const photos = t('about.photos');
  const next = (i + photos.length) % photos.length;
  if (next === aboutIndex) return;
  aboutIndex = next;
  paintAbout(next, true);
}
document.getElementById('about-prev').addEventListener('click', () => goAbout(aboutIndex - 1));
document.getElementById('about-next').addEventListener('click', () => goAbout(aboutIndex + 1));

document.querySelectorAll('.abtn').forEach((btn) => {
  hover(btn, btn.querySelector('.abtn-icon'), { scale: 1 }, { scale: 1.15 }, { tension: 320, friction: 18 });
});

inview(document.getElementById('badge-card'), { opacity: 0, y: 24 }, { opacity: 1, y: 0 }, { tension: 200, friction: 26 }, 120);

{
  const io = new IntersectionObserver((entries) => {
    for (const e of entries) {
      if (!e.isIntersecting) continue;
      io.disconnect();
      play(gwItems, { stagger: GHOST_STAGGER, duration: 700, easing: EASE.easeOutExpo });
      play(aboutPhotoItems, ABOUT_PHOTO_PLAY);
    }
  }, { threshold: 0.1 });
  io.observe(document.getElementById('about-title'));
}

/* ============================================================
   Formats list
   ============================================================ */
const ARROW_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`;
const formatList = document.getElementById('format-list');
const FORMAT_HREFS = [null, null, null, '#dance'];

function rebuildFormats() {
  formatList.textContent = '';
  for (let idx = 0; idx < 4; idx++) {
    const n = idx + 1;
    const name = t(`formats.r${n}Name`);
    const desc = t(`formats.r${n}Desc`);
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.className = 'format-row';
    a.href = FORMAT_HREFS[idx] || TELEGRAM;
    if (!FORMAT_HREFS[idx]) { a.target = '_blank'; a.rel = 'noopener noreferrer'; }
    else a.setAttribute('data-scroll', '');

    const inner = document.createElement('span');
    inner.className = 'format-inner js-rev';
    inner.innerHTML =
      `<span class="format-index">0${n}</span>` +
      `<span class="format-copy"><span class="format-name"></span><span class="format-desc"></span></span>` +
      `<span class="format-arrow">${ARROW_SVG}</span>`;
    inner.querySelector('.format-name').textContent = name;
    inner.querySelector('.format-desc').textContent = desc;

    a.appendChild(inner);
    li.appendChild(a);
    formatList.appendChild(li);

    inview(inner, { opacity: 0, y: 26 }, { opacity: 1, y: 0 }, { tension: 190, friction: 26 }, idx * 90);
    hover(a, inner.querySelector('.format-arrow svg'), { x: 0, opacity: 0.55 }, { x: 8, opacity: 1 }, { tension: 300, friction: 20 });
  }
}

/* ============================================================
   Who it's for
   ============================================================ */
inview(document.getElementById('fw-icon'), { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1 }, { tension: 240, friction: 20 });
document.querySelectorAll('.fw-card').forEach((card, idx) => {
  inview(card, { opacity: 0, y: 48 }, { opacity: 1, y: 0 }, { tension: 180, friction: 26 }, idx * 140);
  const tile = card.querySelector('[data-hover-scale]');
  hover(tile, tile.querySelector('img'), { scale: 1 }, { scale: 1.03 }, { tension: 300, friction: 22 });
});

/* ============================================================
   "Для тебе"
   ============================================================ */
const factsGrid = document.getElementById('facts-grid');
function rebuildFacts() {
  factsGrid.textContent = '';
  t('facts.items').forEach((line, idx) => {
    const cell = document.createElement('li');
    cell.className = 'fact js-rev';
    const v = document.createElement('span');
    v.className = 'fact-line';
    v.textContent = line;
    cell.appendChild(v);
    factsGrid.appendChild(cell);
    inview(cell, { opacity: 0, y: 30 }, { opacity: 1, y: 0 }, { tension: 180, friction: 24 }, idx * 110);
  });
}

/* ============================================================
   Letter / dance / footer reveals
   ============================================================ */
inview(document.getElementById('letter-photo'), { opacity: 0, y: 40 }, { opacity: 1, y: 0 }, { tension: 180, friction: 26 });

/* `autoplay` only fires once, so a loop that scrolls out of view stays paused
   for good. Tie playback to visibility instead — it also stops the video
   costing battery off screen, and honours reduced-motion by holding the poster. */
document.querySelectorAll('video[autoplay]').forEach((v) => {
  if (REDUCED) { v.removeAttribute('autoplay'); v.pause(); return; }
  new IntersectionObserver(([e]) => {
    if (e.isIntersecting) { const p = v.play(); if (p) p.catch(() => {}); }
    else v.pause();
  }, { threshold: 0.15 }).observe(v);
});
inview(document.getElementById('letter-body'), { opacity: 0, y: 40 }, { opacity: 1, y: 0 }, { tension: 180, friction: 26 }, 120);
inview(document.getElementById('dance-photo'), { opacity: 0, y: 40 }, { opacity: 1, y: 0 }, { tension: 180, friction: 26 }, 120);
inview(document.getElementById('footer-pill'), { opacity: 0, y: 20 }, { opacity: 1, y: 0 }, { tension: 200, friction: 24 }, 150);

document.querySelectorAll('.pill').forEach((pill) => {
  const svg = pill.querySelector('svg');
  if (svg) hover(pill, svg, { x: 0 }, { x: 5 }, { tension: 320, friction: 20 });
});

/* ============================================================
   Build the text-reveal registry, then fire on view
   ============================================================ */
Object.entries(REVEAL_OPTS).forEach(([id, opts]) => {
  const el = document.getElementById(id);
  if (!el) return;
  const entry = { el, key: el.dataset.i18n, opts, items: [], fired: false };
  REVEALS.push(entry);
  if (opts.gated) return; // hero — the loader fires these
  const io = new IntersectionObserver((entries) => {
    for (const e of entries) {
      if (!e.isIntersecting) continue;
      io.disconnect();
      entry.fired = true;
      play(entry.items, opts);
    }
  }, { threshold: 0.15, rootMargin: '0px 0px -5% 0px' });
  io.observe(el);
});

/* ============================================================
   Anchors
   ============================================================ */
document.addEventListener('click', (e) => {
  const a = e.target.closest('a[data-scroll]');
  if (!a) return;
  const target = document.querySelector(a.getAttribute('href'));
  if (!target) return;
  e.preventDefault();
  if (a.hasAttribute('data-close-menu')) closeMenu();
  lenis.scrollTo(target, { offset: 0 });
});

/* ============================================================
   Menu
   ============================================================ */
const menuEl = document.getElementById('menu');
const menuBackdropM = new Motion(document.getElementById('menu-backdrop'), { opacity: 0 }, { tension: 260, friction: 30 });
const menuPanelM = new Motion(document.getElementById('menu-panel'), { opacity: 0, y: -24 }, { tension: 220, friction: 28 });
const menuLinkM = [...document.querySelectorAll('#menu-nav a')].map((a) => new Motion(a, { opacity: 0, y: 28 }, { tension: 200, friction: 26 }));
let menuOpen = false;

function openMenu() {
  if (menuOpen) return;
  menuOpen = true;
  menuEl.classList.add('is-open');
  menuEl.setAttribute('aria-hidden', 'false');
  lockScroll();
  menuBackdropM.to({ opacity: 1 });
  menuPanelM.to({ opacity: 1, y: 0 });
  menuLinkM.forEach((m, i) => {
    m.set({ opacity: 0, y: 28 });
    setTimeout(() => m.to({ opacity: 1, y: 0 }), 120 + i * 70);
  });
  syncSticky();
}
function closeMenu() {
  if (!menuOpen) return;
  menuOpen = false;
  menuEl.setAttribute('aria-hidden', 'true');
  menuBackdropM.to({ opacity: 0 });
  menuPanelM.to({ opacity: 0, y: -24 });
  menuLinkM.forEach((m) => m.to({ opacity: 0, y: 28 }));
  unlockScroll();
  syncSticky();
  setTimeout(() => { if (!menuOpen) menuEl.classList.remove('is-open'); }, 450);
}
/* sticky CTA: on screen from the start, stepping aside only for the footer's
   own call to action and for the open menu */
const stickyCta = document.getElementById('sticky-cta');
let footerCtaIn = false;
function syncSticky() {
  stickyCta.classList.toggle('is-visible', !footerCtaIn && !menuOpen);
}
new IntersectionObserver(([e]) => { footerCtaIn = e.isIntersecting; syncSticky(); }, { threshold: 0 })
  .observe(document.querySelector('.footer-cta'));
syncSticky();

/* ============================================================
   Header + layout metrics
   ============================================================ */
/* the header rides along with the page; the plate behind it only appears once
   the linen it sits on has started to move */
const headerEl = document.getElementById('site-header');
let headerStuck = false;
function syncHeader() {
  const stuck = window.scrollY > 4;
  if (stuck === headerStuck) return;
  headerStuck = stuck;
  headerEl.classList.toggle('is-stuck', stuck);
}
window.addEventListener('scroll', syncHeader, { passive: true });
syncHeader();

/* the banner sizes itself against the header above it and — on phones — the
   half of the time card that hangs below its bottom edge */
const nextclassEl = document.getElementById('nextclass');
function syncMetrics() {
  const root = document.documentElement.style;
  root.setProperty('--hdr-h', `${headerEl.offsetHeight}px`);
  root.setProperty('--cluster-h', `${nextclassEl.offsetHeight}px`);
}
syncMetrics();
window.addEventListener('resize', syncMetrics);
document.fonts.ready.then(syncMetrics);

document.querySelectorAll('[data-open-menu]').forEach((b) => b.addEventListener('click', openMenu));
document.getElementById('menu-close').addEventListener('click', closeMenu);
document.getElementById('menu-backdrop').addEventListener('click', closeMenu);
document.querySelectorAll('.icon-close').forEach((btn) => {
  hover(btn, btn.querySelector('svg'), { rotate: 0 }, { rotate: 90 }, { tension: 300, friction: 18 });
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && menuOpen) closeMenu(); });

/* ============================================================
   Hero gated reveals + loader
   ============================================================ */
const nextclassM = new Motion(document.getElementById('nextclass'), { opacity: 0, y: 28 }, { tension: 200, friction: 26 });

let heroReady = false;
function setReady() {
  if (heroReady) return;
  heroReady = true;
  REVEALS.filter((r) => r.opts.gated).forEach((r) => { r.fired = true; play(r.items, r.opts); });
  setTimeout(() => nextclassM.to({ opacity: 1, y: 0 }), 650);
}

/* first paint: fill in every string, keep reveals hidden */
applyI18n({ instant: false });

const loaderEl = document.getElementById('loader');
const loaderFill = document.getElementById('loader-fill');
const loaderMarkM = new Motion(document.getElementById('loader-mark'), { opacity: 0, y: 16 }, { tension: 200, friction: 22 });

lockScroll();
loaderMarkM.to({ opacity: 1, y: 0 });

const MIN_VISIBLE = REDUCED ? 200 : LOADER.MIN_VISIBLE_MS;
const FILL_MS = Math.max(0, MIN_VISIBLE - LOADER.FILL_DELAY);

requestAnimationFrame(() => {
  loaderFill.style.transition = `transform ${FILL_MS}ms ${EASE.easeInOutCubic}`;
  loaderFill.style.transitionDelay = `${LOADER.FILL_DELAY}ms`;
  requestAnimationFrame(() => { loaderFill.style.transform = 'scaleX(1)'; });
});

let countdownStarted = false;
function startCountdown() {
  if (countdownStarted) return;
  countdownStarted = true;
  setTimeout(finishLoader, MIN_VISIBLE);
}
if (document.readyState === 'complete') startCountdown();
else window.addEventListener('load', startCountdown, { once: true });
setTimeout(startCountdown, LOADER.MAX_VISIBLE_MS);

let loaderDone = false;
function finishLoader() {
  if (loaderDone) return;
  loaderDone = true;
  setReady();
  unlockScroll();
  const exit = REDUCED ? 0 : LOADER.EXIT_MS;
  if (exit === 0) { loaderEl.remove(); return; }
  loaderEl.style.transition = `transform ${exit}ms ${EASE.easeInOutCubic}`;
  requestAnimationFrame(() => { loaderEl.style.transform = 'translateY(-105%)'; });
  setTimeout(() => loaderEl.remove(), exit);
}

window.addEventListener('resize', () => { window.__setRootFontSize && window.__setRootFontSize(); });
</script>
