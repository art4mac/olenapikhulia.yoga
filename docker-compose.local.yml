# Local preview — the same nginx image and the same nginx.conf the coventpro
# stack serves, with ./site bind-mounted so an edit shows up on reload without
# a rebuild.
#
# The base docker-compose.yml in this repo is the git-backed Portainer stack for
# olenapikhulia.dev.coventpro.ai (Traefik labels, host paths, external network),
# and Portainer pulls it from that exact path — so the local environment gets its
# own file instead of taking over the base.
#
#   docker compose up -d     # COMPOSE_FILE in .env points here → http://localhost:8081
#   docker compose down
services:
  site:
    image: nginx:1.27-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-local-olenapikhulia}-site
    restart: unless-stopped
    # loopback only: the preview has no business being reachable from the LAN
    ports:
      - "127.0.0.1:${SITE_PORT:-8081}:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 64M}
        reservations: {memory: 16M}
