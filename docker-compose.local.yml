# Local preview — the same nginx image and the same nginx.conf the coventpro
# stack serves, with ./site bind-mounted so an edit shows up on reload without
# a rebuild.
#
# The base docker-compose.yml in this repo is the git-backed Portainer stack for
# olenapikhulia.dev.coventpro.ai (Traefik labels, host paths, external network),
# and Portainer pulls it from that exact path — so the local environment gets its
# own file instead of taking over the base.
#
#   docker compose up -d     # COMPOSE_FILE in .env points here → http://localhost:8081
#   docker compose down
#
# DOWN_MODE=true serves the holding page instead of the site, the same switch the
# host stacks read — here both directories are mounted and the served root is a
# symlink to one of them, since the host stacks pick theirs while syncing.
services:
  site:
    image: nginx:1.27-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-local-olenapikhulia}-site
    restart: unless-stopped
    # loopback only: the preview has no business being reachable from the LAN
    ports:
      - "127.0.0.1:${SITE_PORT:-8081}:80"
    environment:
      DOWN_MODE: ${DOWN_MODE:-false}
      SITE_URL: ${SITE_URL:-http://localhost:${SITE_PORT:-8081}}
    volumes:
      - ./site:/srv/site:ro
      - ./down:/srv/down:ro
      # a template, not a conf: the image's envsubst pass puts SITE_URL into it
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        rm -rf /usr/share/nginx/html
        if [ "$$DOWN_MODE" = "true" ]; then
          ln -s /srv/down /usr/share/nginx/html
        else
          ln -s /srv/site /usr/share/nginx/html
        fi
        exec /docker-entrypoint.sh nginx -g 'daemon off;'
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 64M}
        reservations: {memory: 16M}
