server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # The canonical and share-card URLs must be absolute and differ per host, so
    # the pages carry a __SITE_URL__ token and it is swapped on the way out.
    # ${SITE_URL} itself is filled in by the nginx image's envsubst pass over
    # /etc/nginx/templates — which is why the compose files mount this file as
    # default.conf.template and pass SITE_URL.
    sub_filter_types text/html;
    sub_filter_once off;
    sub_filter '__SITE_URL__' '${SITE_URL}';

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico|webp|mp4)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";

        # nginx drops inherited add_header as soon as a nested block declares its
        # own, so the security headers have to be restated here.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
