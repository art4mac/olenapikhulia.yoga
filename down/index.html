  /* the pointer is a spotlight over the mark: a pool of colour that keeps its
     size, so how much of the mark it lights is a matter of how close it is (see
     the script). The pool is a bit over twice the mark, and full colour holds
     inside a fifth of it before the fall to grey begins. Until the pointer moves
     both stops are the logo's own grey. */
  --tint-reach:23rem;
  --tint-stop:4.5rem;
  background-color:var(--uy-grey);
  background-image:radial-gradient(
    circle var(--tint-reach) at var(--tint-x,50%) var(--tint-y,50%),
    var(--tint,var(--uy-grey)) var(--tint-stop), var(--uy-grey) 100%);
  -webkit-mask:var(--lockup) center/contain no-repeat;
          mask:var(--lockup) center/contain no-repeat;
}
@keyframes rise{ to{opacity:1;transform:translateY(0)} }
@media (prefers-reduced-motion:reduce){
  .mark{opacity:1;transform:none;animation:none}
}

</head>
<body>
  <div class="mark">
    <span class="uy" role="img" aria-label="Українська федерація йоги"></span>
    <span>Олена Піхуля</span>
  </div>
<script>
/* The pointer is a spotlight over the mark. Only two things are written: the hue,
   which is the pointer's angle around the mark, and the centre of the pool, which
   is the pointer itself in the mark's own coordinates. The pool's size is a
   constant in the stylesheet, so the geometry does the rest — the closer it comes
   the more of the mark falls inside it and takes the colour, and from a screen
   away nothing does. One paint per frame, whatever the pointer's event rate. */
(function () {
  var uy = document.querySelector('.uy');
  var last = null;
  function paint() {
    var e = last; last = null;
    if (!e) return;
    var r = uy.getBoundingClientRect();
    var deg = Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2)) * 180 / Math.PI;
    var s = uy.style;
    s.setProperty('--tint', 'hsl(' + ((deg + 360) % 360).toFixed(1) + ' 68% 46%)');
    s.setProperty('--tint-x', ((e.clientX - r.left) / r.width * 100).toFixed(1) + '%');
    s.setProperty('--tint-y', ((e.clientY - r.top) / r.height * 100).toFixed(1) + '%');
  }
  addEventListener('pointermove', function (e) {
    if (!last) requestAnimationFrame(paint);
    last = e;
  }, { passive: true });
})();
</script>
</body>
