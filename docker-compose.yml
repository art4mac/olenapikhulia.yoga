services:
  # One-shot: builds an image from the git content and syncs it into the host web root.
  #
  # DOWN_MODE=true syncs the holding page instead of the site, so in down mode the
  # web root holds that page alone — the site's files are not on disk to be found.
  # Flipping the variable and redeploying the stack is the whole switch.
  content-sync:
    build:
      context: .
      dockerfile: Dockerfile
    image: dev-olenapikhulia-content:latest
    container_name: dev-olenapikhulia-sync
    restart: "no"
    environment:
      DOWN_MODE: ${DOWN_MODE:-false}
    volumes:
      - /var/www/vhosts/olenapikhulia.dev.coventpro.ai:/dest
      - /home/docker/infra/volumes/dev-olenapikhulia:/conf
    command:
      - sh
      - -ec
      - |
        mkdir -p /dest /conf
        if [ "$$DOWN_MODE" = "true" ]; then
          rsync -a --delete /src/down/ /dest/
          echo "DOWN_MODE=true — holding page only -> /var/www/vhosts/olenapikhulia.dev.coventpro.ai"
        else
          rsync -a --delete /src/site/ /dest/
          echo "synced git -> /var/www/vhosts/olenapikhulia.dev.coventpro.ai"
        fi
        cp -a /src/nginx.conf /conf/nginx.conf

  dev-olenapikhulia:
    image: nginx:1.27-alpine
    container_name: dev-olenapikhulia
    restart: unless-stopped
    depends_on:
      content-sync:
        condition: service_completed_successfully
    networks: [coventit-net]
    environment:
      SITE_URL: ${SITE_URL:-https://olenapikhulia.dev.coventpro.ai}
    volumes:
      - /var/www/vhosts/olenapikhulia.dev.coventpro.ai:/usr/share/nginx/html:ro
      # a template, not a conf: the image's envsubst pass puts SITE_URL into it
      - /home/docker/infra/volumes/dev-olenapikhulia/nginx.conf:/etc/nginx/templates/default.conf.template:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 64M}
        reservations: {memory: 16M}
    labels:
      - traefik.enable=true
      - traefik.docker.network=coventit-net

      # --- HTTPS (websecure) ---
      - traefik.http.routers.dev-olenapikhulia.rule=Host(`olenapikhulia.dev.coventpro.ai`)
      - traefik.http.routers.dev-olenapikhulia.entrypoints=websecure
      - traefik.http.routers.dev-olenapikhulia.service=dev-olenapikhulia
      - traefik.http.routers.dev-olenapikhulia.tls=true
      - traefik.http.routers.dev-olenapikhulia.tls.certresolver=letsencrypt

      # --- service port ---
      - traefik.http.services.dev-olenapikhulia.loadbalancer.server.port=80

networks:
  coventit-net:
    external: true
