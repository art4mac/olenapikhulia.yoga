services:
  # One-shot: builds an image from the git content and syncs it into the host web root.
  content-sync:
    build:
      context: .
      dockerfile: Dockerfile
    image: dev-olenapikhulia-content:latest
    container_name: dev-olenapikhulia-sync
    restart: "no"
    volumes:
      - /var/www/vhosts/olenapikhulia.dev.coventpro.ai:/dest
      - /home/docker/infra/volumes/dev-olenapikhulia:/conf
    command:
      - sh
      - -ec
      - |
        mkdir -p /dest /conf
        rsync -a --delete /src/site/ /dest/
        cp -a /src/nginx.conf /conf/nginx.conf
        echo "synced git -> /var/www/vhosts/olenapikhulia.dev.coventpro.ai"

  dev-olenapikhulia:
    image: nginx:1.27-alpine
    container_name: dev-olenapikhulia
    restart: unless-stopped
    depends_on:
      content-sync:
        condition: service_completed_successfully
    networks: [coventit-net]
    volumes:
      - /var/www/vhosts/olenapikhulia.dev.coventpro.ai:/usr/share/nginx/html:ro
      - /home/docker/infra/volumes/dev-olenapikhulia/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 64M}
        reservations: {memory: 16M}
    labels:
      - traefik.enable=true
      - traefik.docker.network=coventit-net

      # --- HTTPS (websecure) ---
      - traefik.http.routers.dev-olenapikhulia.rule=Host(`olenapikhulia.dev.coventpro.ai`)
      - traefik.http.routers.dev-olenapikhulia.entrypoints=websecure
      - traefik.http.routers.dev-olenapikhulia.service=dev-olenapikhulia
      - traefik.http.routers.dev-olenapikhulia.tls=true
      - traefik.http.routers.dev-olenapikhulia.tls.certresolver=letsencrypt

      # --- service port ---
      - traefik.http.services.dev-olenapikhulia.loadbalancer.server.port=80

networks:
  coventit-net:
    external: true
